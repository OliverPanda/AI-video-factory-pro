<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
  <style>
    text {
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", "SimHei", Arial, sans-serif;
    }
    .title { font-size: 24px; font-weight: 700; fill: #111827; }
    .subtitle { font-size: 13px; fill: #6b7280; }
    .lane { fill-opacity: 0.08; stroke-width: 1.2; stroke-dasharray: 7 5; rx: 12; }
    .lane-label { font-size: 12px; font-weight: 700; fill: #374151; letter-spacing: .04em; }
    .node-title { font-size: 14px; font-weight: 700; fill: #111827; }
    .node-sub { font-size: 11px; fill: #4b5563; }
    .small { font-size: 10.5px; fill: #6b7280; }
    .badge { font-size: 10px; font-weight: 700; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#111827" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="40" y="42" class="title">跨集角色一致性方案：从“固定 seed”升级为“角色资产图谱”</text>
  <text x="40" y="66" class="subtitle">参考 libtv / TapNow 的公开工作流：无限画布、节点引用、多图参考、三视图锁定、首尾帧连续性；结合本项目 ID-first 角色链路落地。</text>

  <rect x="40" y="92" width="1120" height="150" class="lane" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="56" y="116" class="lane-label">公开产品范式：画布/节点保存上下文，而不是只保存 prompt</text>

  <rect x="70" y="130" width="170" height="82" rx="10" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="82" y="142" width="50" height="22" rx="11" fill="#dbeafe"/>
  <text x="107" y="157" text-anchor="middle" class="badge" fill="#2563eb">Canvas</text>
  <text x="148" y="157" class="node-title">脚本/分镜节点</text>
  <text x="86" y="181" class="node-sub">拆角色、场景、镜头</text>
  <text x="86" y="198" class="node-sub">每个节点保留上下文</text>

  <rect x="290" y="130" width="178" height="82" rx="10" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="302" y="142" width="50" height="22" rx="11" fill="#dbeafe"/>
  <text x="327" y="157" text-anchor="middle" class="badge" fill="#2563eb">3View</text>
  <text x="368" y="157" class="node-title">角色三视图</text>
  <text x="306" y="181" class="node-sub">正面 / 侧面 / 背面</text>
  <text x="306" y="198" class="node-sub">主角变成可复用资产</text>

  <rect x="520" y="130" width="182" height="82" rx="10" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="532" y="142" width="50" height="22" rx="11" fill="#dbeafe"/>
  <text x="557" y="157" text-anchor="middle" class="badge" fill="#2563eb">Refs</text>
  <text x="598" y="157" class="node-title">多图参考</text>
  <text x="536" y="181" class="node-sub">角色、场景、风格参考</text>
  <text x="536" y="198" class="node-sub">传入图像/视频模型</text>

  <rect x="752" y="130" width="178" height="82" rx="10" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="764" y="142" width="50" height="22" rx="11" fill="#dbeafe"/>
  <text x="789" y="157" text-anchor="middle" class="badge" fill="#2563eb">I2V</text>
  <text x="830" y="157" class="node-title">首尾帧视频</text>
  <text x="768" y="181" class="node-sub">起点/终点约束动作</text>
  <text x="768" y="198" class="node-sub">控制跨镜头连续性</text>

  <rect x="980" y="130" width="145" height="82" rx="10" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="992" y="142" width="50" height="22" rx="11" fill="#dbeafe"/>
  <text x="1017" y="157" text-anchor="middle" class="badge" fill="#2563eb">TapTV</text>
  <text x="1058" y="157" class="node-title">共享画布</text>
  <text x="996" y="181" class="node-sub">复用历史 workflow</text>
  <text x="996" y="198" class="node-sub">人工校正后沉淀</text>

  <path d="M 240 171 L 290 171" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="265" y="160" text-anchor="middle" class="small">节点引用</text>
  <path d="M 468 171 L 520 171" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="494" y="160" text-anchor="middle" class="small">资产引用</text>
  <path d="M 702 171 L 752 171" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="727" y="160" text-anchor="middle" class="small">帧约束</text>
  <path d="M 930 171 L 980 171" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="955" y="160" text-anchor="middle" class="small">复用</text>

  <rect x="40" y="266" width="1120" height="238" class="lane" fill="#f0fdf4" stroke="#86efac"/>
  <text x="56" y="290" class="lane-label">本项目建议：Project Character Graph，角色身份长期持久化</text>

  <rect x="70" y="310" width="170" height="110" rx="10" fill="#ffffff" stroke="#22c55e" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="82" y="322" width="50" height="22" rx="11" fill="#dcfce7"/>
  <text x="107" y="337" text-anchor="middle" class="badge" fill="#16a34a">Input</text>
  <text x="148" y="337" class="node-title">Script Ingest</text>
  <text x="86" y="361" class="node-sub">整部/单集剧本导入</text>
  <text x="86" y="378" class="node-sub">抽取候选角色/别名</text>
  <text x="86" y="395" class="node-sub">统计出场与对白</text>

  <rect x="285" y="310" width="190" height="110" rx="10" fill="#ffffff" stroke="#22c55e" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="297" y="322" width="50" height="22" rx="11" fill="#dcfce7"/>
  <text x="322" y="337" text-anchor="middle" class="badge" fill="#16a34a">Link</text>
  <text x="363" y="337" class="node-title">Role Linker</text>
  <text x="301" y="361" class="node-sub">name/alias + 语义匹配</text>
  <text x="301" y="378" class="node-sub">跨集合并或新建</text>
  <text x="301" y="395" class="node-sub">冲突进入人工确认</text>

  <ellipse cx="590" cy="305" rx="90" ry="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="500" y="305" width="180" height="105" fill="#eff6ff"/>
  <line x1="500" y1="305" x2="500" y2="410" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="680" y1="305" x2="680" y2="410" stroke="#2563eb" stroke-width="1.5"/>
  <ellipse cx="590" cy="410" rx="90" ry="14" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="590" y="335" text-anchor="middle" class="node-title">Character Graph</text>
  <text x="590" y="360" text-anchor="middle" class="small">characterBibleId</text>
  <text x="590" y="377" text-anchor="middle" class="small">episodeCharacterId</text>
  <text x="590" y="394" text-anchor="middle" class="small">identitySeed</text>

  <rect x="805" y="310" width="160" height="110" rx="10" fill="#ffffff" stroke="#22c55e" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="817" y="322" width="50" height="22" rx="11" fill="#dcfce7"/>
  <text x="842" y="337" text-anchor="middle" class="badge" fill="#16a34a">Assets</text>
  <text x="883" y="337" class="node-title">Asset Vault</text>
  <text x="821" y="361" class="node-sub">三视图、头像、最佳帧</text>
  <text x="821" y="378" class="node-sub">voice cast、禁漂移词</text>
  <text x="821" y="395" class="node-sub">版本化 canonical refs</text>

  <rect x="1010" y="310" width="120" height="110" rx="10" fill="#ffffff" stroke="#22c55e" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="1022" y="322" width="50" height="22" rx="11" fill="#dcfce7"/>
  <text x="1047" y="337" text-anchor="middle" class="badge" fill="#16a34a">Bind</text>
  <text x="1088" y="337" class="node-title">Shot Binder</text>
  <text x="1026" y="361" class="node-sub">每个镜头绑定 ID</text>
  <text x="1026" y="378" class="node-sub">不是绑定名字</text>
  <text x="1026" y="395" class="node-sub">输出 referenceImages</text>

  <path d="M 240 365 L 285 365" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="262" y="354" text-anchor="middle" class="small">候选角色</text>
  <path d="M 475 365 L 500 365" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="488" y="354" text-anchor="middle" class="small">写入</text>
  <path d="M 680 365 L 805 365" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="742" y="354" text-anchor="middle" class="small">读写</text>
  <path d="M 965 365 L 1010 365" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="988" y="354" text-anchor="middle" class="small">绑定</text>
  <path d="M 865 420 C 840 470 690 480 610 420" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-green)"/>
  <text x="750" y="470" text-anchor="middle" class="small">回填资产</text>

  <rect x="40" y="528" width="1120" height="150" class="lane" fill="#fff7ed" stroke="#fdba74"/>
  <text x="56" y="552" class="lane-label">生成与质检闭环：引用、验证、回写，越跑越稳</text>

  <rect x="80" y="565" width="160" height="78" rx="10" fill="#ffffff" stroke="#f97316" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="92" y="577" width="50" height="22" rx="11" fill="#ffedd5"/>
  <text x="117" y="592" text-anchor="middle" class="badge" fill="#f97316">Prompt</text>
  <text x="153" y="592" class="node-title">Prompt Builder</text>
  <text x="96" y="616" class="node-sub">ID-first 注入身份锚点</text>
  <text x="96" y="633" class="node-sub">带 canonical refs</text>

  <rect x="290" y="565" width="160" height="78" rx="10" fill="#ffffff" stroke="#f97316" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="302" y="577" width="50" height="22" rx="11" fill="#ffedd5"/>
  <text x="327" y="592" text-anchor="middle" class="badge" fill="#f97316">Gen</text>
  <text x="364" y="592" class="node-title">Image / Video Gen</text>
  <text x="306" y="616" class="node-sub">seed 仅辅助复现</text>
  <text x="306" y="633" class="node-sub">参考图才是主约束</text>

  <rect x="500" y="565" width="160" height="78" rx="10" fill="#ffffff" stroke="#f97316" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="512" y="577" width="50" height="22" rx="11" fill="#ffedd5"/>
  <text x="537" y="592" text-anchor="middle" class="badge" fill="#f97316">QA</text>
  <text x="575" y="592" class="node-title">Consistency QA</text>
  <text x="516" y="616" class="node-sub">人脸/服装/配饰漂移</text>
  <text x="516" y="633" class="node-sub">主角阈值更严格</text>

  <rect x="710" y="565" width="170" height="78" rx="10" fill="#ffffff" stroke="#f97316" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="722" y="577" width="50" height="22" rx="11" fill="#ffedd5"/>
  <text x="747" y="592" text-anchor="middle" class="badge" fill="#f97316">Regen</text>
  <text x="787" y="592" class="node-title">Reanchor Regen</text>
  <text x="726" y="616" class="node-sub">失败镜头带参考图重生</text>
  <text x="726" y="633" class="node-sub">更新 best frame</text>

  <rect x="930" y="565" width="160" height="78" rx="10" fill="#ffffff" stroke="#f97316" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="942" y="577" width="50" height="22" rx="11" fill="#ffedd5"/>
  <text x="967" y="592" text-anchor="middle" class="badge" fill="#f97316">Out</text>
  <text x="1004" y="592" class="node-title">Episode Output</text>
  <text x="946" y="616" class="node-sub">分镜图、视频、音频</text>
  <text x="946" y="633" class="node-sub">delivery summary</text>

  <path d="M 240 604 L 290 604" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="265" y="593" text-anchor="middle" class="small">生成</text>
  <path d="M 450 604 L 500 604" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <text x="475" y="593" text-anchor="middle" class="small">检查</text>
  <path d="M 660 604 L 710 604" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="685" y="593" text-anchor="middle" class="small">漂移</text>
  <path d="M 880 604 L 930 604" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="905" y="593" text-anchor="middle" class="small">通过</text>
  <path d="M 795 565 C 760 510 590 505 580 565" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-green)"/>
  <text x="690" y="512" text-anchor="middle" class="small">best frame 写回</text>
  <path d="M 1080 565 C 1105 510 1045 455 1080 420" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-green)"/>
  <text x="1105" y="490" text-anchor="middle" class="small">跨集复用</text>
  <path d="M 1080 420 C 1130 475 1125 548 1090 590" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="1130" y="515" text-anchor="middle" class="small">下一集引用</text>

  <rect x="70" y="700" width="785" height="38" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="88" y="724" class="node-sub">核心判断：临时角色可只建 episodeCharacter；主角/复现角色必须绑定 characterBibleId，并携带 canonical refs。固定 seed 是可选字段，不是身份系统。</text>

  <g transform="translate(900,690)">
    <line x1="0" y1="6" x2="30" y2="6" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <text x="38" y="10" class="small">主数据流</text>
    <line x1="0" y1="24" x2="30" y2="24" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
    <text x="38" y="28" class="small">资产读写</text>
    <line x1="0" y1="42" x2="30" y2="42" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
    <text x="38" y="46" class="small">解析/控制</text>
    <line x1="0" y1="60" x2="30" y2="60" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
    <text x="38" y="64" class="small">漂移反馈</text>
  </g>
</svg>
