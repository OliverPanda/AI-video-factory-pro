<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100">
  <style>
    text { font-family: "Plus Jakarta Sans", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; fill: #0f172a; }
    .heading { font-size: 28px; font-weight: 900; letter-spacing: 0; }
    .sub { font-size: 13px; fill: #64748b; }
    .board { font-size: 19px; font-weight: 900; letter-spacing: 0; }
    .h2 { font-size: 15px; font-weight: 900; }
    .label { font-size: 12px; font-weight: 800; fill: #334155; }
    .body { font-size: 12px; fill: #475569; }
    .muted { font-size: 10.5px; fill: #94a3b8; font-weight: 600; }
    .chip { font-size: 10px; font-weight: 900; }
    .btn { font-size: 12px; font-weight: 900; fill: #ffffff; }
    .btn2 { font-size: 12px; font-weight: 900; fill: #0f766e; }
    .mini { font-size: 9px; font-weight: 800; fill: #64748b; }
  </style>

  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#0f172a" flood-opacity="0.06"/>
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>
    <linearGradient id="pageBg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#fafbfc"/>
      <stop offset="46%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="52%" stop-color="#f0fdfa"/>
      <stop offset="100%" stop-color="#ecfdf5"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="coverA" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="58%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="coverB" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="48%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <marker id="arrow" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0 0, 11 4, 0 8" fill="#0d9488"/>
    </marker>
  </defs>

  <rect width="1600" height="1100" fill="url(#pageBg)"/>

  <g transform="translate(60 34)">
    <text x="0" y="26" class="heading">项目创建与剧集管理 UI 参考图</text>
    <text x="0" y="54" class="sub">按当前前端视觉语言重绘：暖白背景、微阴影卡片、青蓝薄荷主色、rounded-2xl、低压工作台体验。</text>
  </g>

  <g transform="translate(930 40)">
    <rect x="0" y="0" width="600" height="58" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#cardShadow)"/>
    <text x="26" y="24" class="mini">信息层级</text>
    <text x="26" y="43" class="body">我的漫剧项目 → 项目详情 → 第一集 / 第二集 / 第三集 → DramaDetail 单集详情</text>
  </g>

  <!-- Board 1 -->
  <g transform="translate(60 130)">
    <rect x="0" y="0" width="700" height="420" rx="24" fill="#ffffff" stroke="#e2e8f0" filter="url(#cardShadow)"/>
    <text x="28" y="40" class="board">画板 1：我的漫剧项目</text>
    <text x="28" y="64" class="sub">复用当前 Dashboard 的欢迎区、统计卡、项目卡片气质。</text>

    <rect x="28" y="90" width="644" height="72" rx="18" fill="url(#hero)" stroke="#bae6fd"/>
    <rect x="50" y="108" width="38" height="38" rx="12" fill="url(#primary)"/>
    <text x="61" y="132" class="btn">AI</text>
    <text x="104" y="118" class="h2">欢迎回来</text>
    <text x="104" y="142" class="body">你有 2 个漫剧项目，1 集可导出，1 集待审片。</text>
    <rect x="470" y="108" width="94" height="38" rx="12" fill="url(#primary)"/>
    <text x="492" y="132" class="btn">新建漫剧</text>
    <rect x="576" y="108" width="72" height="38" rx="12" fill="#ffffff" stroke="#99f6e4"/>
    <text x="591" y="132" class="btn2">导入剧本</text>

    <g transform="translate(28 184)">
      <rect x="0" y="0" width="306" height="190" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
      <rect x="22" y="24" width="82" height="112" rx="16" fill="url(#coverA)"/>
      <circle cx="46" cy="48" r="10" fill="#ecfeff" opacity="0.95"/>
      <path d="M22 122 C52 78, 78 82, 104 40 L104 136 L22 136 Z" fill="#ffffff" opacity="0.2"/>
      <text x="124" y="40" class="h2">双生囚笼</text>
      <text x="124" y="66" class="body">双胞胎姐妹被迫互换身份，</text>
      <text x="124" y="84" class="body">在豪门阴谋中寻找真相。</text>
      <rect x="124" y="102" width="54" height="24" rx="9" fill="#ecfeff" stroke="#a5f3fc"/>
      <text x="138" y="118" class="chip" fill="#0891b2">12 集</text>
      <rect x="188" y="102" width="68" height="24" rx="9" fill="#fef3c7" stroke="#fde68a"/>
      <text x="202" y="118" class="chip" fill="#a16207">待审片</text>
      <text x="124" y="150" class="muted">电影感 / 9:16 / 60秒</text>
      <rect x="22" y="150" width="94" height="34" rx="11" fill="url(#primary)"/>
      <text x="46" y="172" class="btn">进入项目</text>
      <rect x="126" y="150" width="94" height="34" rx="11" fill="#ffffff" stroke="#99f6e4"/>
      <text x="150" y="172" class="btn2">继续制作</text>
    </g>

    <g transform="translate(366 184)">
      <rect x="0" y="0" width="306" height="190" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
      <rect x="22" y="24" width="82" height="112" rx="16" fill="url(#coverB)"/>
      <path d="M22 116 C52 88, 74 86, 104 52 L104 136 L22 136 Z" fill="#ffffff" opacity="0.18"/>
      <text x="124" y="40" class="h2">寒烬宫变</text>
      <text x="124" y="66" class="body">冷宫弃妃重回权力中心，</text>
      <text x="124" y="84" class="body">用一场宫变改写命运。</text>
      <rect x="124" y="102" width="48" height="24" rx="9" fill="#ecfeff" stroke="#a5f3fc"/>
      <text x="136" y="118" class="chip" fill="#0891b2">8 集</text>
      <rect x="182" y="102" width="66" height="24" rx="9" fill="#dcfce7" stroke="#bbf7d0"/>
      <text x="196" y="118" class="chip" fill="#15803d">可导出</text>
      <text x="124" y="150" class="muted">古风 / 9:16 / 60秒</text>
      <rect x="22" y="150" width="94" height="34" rx="11" fill="url(#primary)"/>
      <text x="46" y="172" class="btn">进入项目</text>
      <rect x="126" y="150" width="94" height="34" rx="11" fill="#ffffff" stroke="#99f6e4"/>
      <text x="150" y="172" class="btn2">继续制作</text>
    </g>
  </g>

  <!-- Board 2 -->
  <g transform="translate(840 130)">
    <rect x="0" y="0" width="700" height="420" rx="24" fill="#ffffff" stroke="#e2e8f0" filter="url(#cardShadow)"/>
    <text x="28" y="40" class="board">画板 2：新建漫剧向导</text>
    <text x="28" y="64" class="sub">接近现有 CreateProjectModal：白底、slate 分区、cyan focus、圆角表单。</text>

    <rect x="28" y="92" width="644" height="50" rx="16" fill="#f1f5f9" stroke="#e2e8f0"/>
    <rect x="40" y="104" width="118" height="26" rx="10" fill="url(#primary)"/>
    <text x="66" y="122" class="btn">1 基础信息</text>
    <text x="196" y="122" class="muted">2 全局视觉风格</text>
    <text x="370" y="122" class="muted">3 导入剧本</text>
    <text x="526" y="122" class="muted">4 确认创建</text>

    <g transform="translate(28 168)">
      <rect x="0" y="0" width="300" height="206" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="20" y="30" class="h2">Step 1：基础信息</text>
      <text x="20" y="58" class="label">漫剧名称</text>
      <rect x="20" y="68" width="260" height="36" rx="11" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="36" y="92" class="body">双生囚笼</text>
      <text x="20" y="126" class="label">项目简介</text>
      <rect x="20" y="136" width="260" height="52" rx="11" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="36" y="158" class="body">互换身份、豪门复仇、</text>
      <text x="36" y="176" class="body">姐妹反转的竖屏漫剧。</text>
    </g>

    <g transform="translate(348 168)">
      <rect x="0" y="0" width="324" height="206" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="20" y="30" class="h2">Step 2：全局视觉风格</text>
      <text x="20" y="58" class="label">画面风格</text>
      <g transform="translate(20 72)">
        <rect x="0" y="0" width="44" height="28" rx="10" fill="url(#primary)"/><text x="10" y="19" class="chip" fill="#ffffff">写实</text>
        <rect x="52" y="0" width="38" height="28" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="63" y="19" class="chip">3D</text>
        <rect x="98" y="0" width="44" height="28" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="107" y="19" class="chip">国漫</text>
        <rect x="150" y="0" width="44" height="28" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="159" y="19" class="chip">日漫</text>
        <rect x="202" y="0" width="44" height="28" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="211" y="19" class="chip">赛博</text>
        <rect x="254" y="0" width="44" height="28" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="263" y="19" class="chip">古风</text>
        <rect x="0" y="38" width="62" height="28" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="12" y="57" class="chip">电影感</text>
      </g>
      <text x="20" y="148" class="label">输出比例</text>
      <rect x="90" y="130" width="64" height="32" rx="11" fill="#ecfeff" stroke="#67e8f9"/>
      <text x="108" y="151" class="chip" fill="#0891b2">9:16</text>
      <text x="170" y="151" class="muted">默认竖屏短剧</text>
      <text x="20" y="188" class="label">单集目标时长</text>
      <rect x="120" y="170" width="48" height="32" rx="11" fill="#f8fafc" stroke="#cbd5e1"/><text x="129" y="191" class="chip">30秒</text>
      <rect x="176" y="170" width="48" height="32" rx="11" fill="url(#primary)"/><text x="185" y="191" class="chip" fill="#ffffff">60秒</text>
      <rect x="232" y="170" width="48" height="32" rx="11" fill="#f8fafc" stroke="#cbd5e1"/><text x="241" y="191" class="chip">90秒</text>
    </g>
  </g>

  <!-- Board 3 -->
  <g transform="translate(60 610)">
    <rect x="0" y="0" width="700" height="420" rx="24" fill="#ffffff" stroke="#e2e8f0" filter="url(#cardShadow)"/>
    <text x="28" y="40" class="board">画板 3：项目详情页</text>
    <text x="28" y="64" class="sub">项目级总览承载简介、剧本、全局设定和剧集入口。</text>

    <rect x="28" y="88" width="644" height="104" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="50" y="122" class="board">双生囚笼</text>
    <rect x="158" y="102" width="64" height="24" rx="9" fill="#fef3c7" stroke="#fde68a"/>
    <text x="172" y="118" class="chip" fill="#a16207">制作中</text>
    <text x="50" y="150" class="body">项目简介：互换身份、豪门复仇、姐妹反转的竖屏漫剧。</text>
    <text x="50" y="174" class="muted">全局设定：电影感 / 9:16 / 60秒 / 抖音、小红书</text>
    <rect x="402" y="108" width="102" height="38" rx="12" fill="#ffffff" stroke="#99f6e4"/><text x="417" y="132" class="btn2">导入/更换剧本</text>
    <rect x="516" y="108" width="84" height="38" rx="12" fill="#ffffff" stroke="#99f6e4"/><text x="533" y="132" class="btn2">编辑设定</text>
    <rect x="612" y="108" width="42" height="38" rx="12" fill="url(#primary)"/><text x="621" y="132" class="btn">新增</text>

    <g transform="translate(28 226)">
      <rect x="0" y="0" width="132" height="150" rx="18" fill="#f8fafc" stroke="#e2e8f0"/>
      <rect x="14" y="16" width="104" height="32" rx="12" fill="url(#primary)"/><text x="48" y="37" class="btn">总览</text>
      <text x="24" y="74" class="body">剧本</text>
      <text x="24" y="101" class="body">剧集</text>
      <text x="24" y="128" class="body">角色资产</text>
      <text x="24" y="150" class="body">全局设定</text>
    </g>

    <g transform="translate(184 226)">
      <rect x="0" y="0" width="488" height="150" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="22" y="34" class="h2">项目总览</text>
      <rect x="22" y="54" width="444" height="14" rx="7" fill="#e2e8f0"/>
      <rect x="22" y="54" width="284" height="14" rx="7" fill="#14b8a6"/>
      <text x="22" y="96" class="body">制作进度：剧本导入 → 拆集 → 分镜 → 出图 → 视频 → 成片</text>
      <text x="22" y="122" class="body">当前建议：继续制作第 2 集，或进入第 1 集审片。</text>
    </g>
  </g>

  <!-- Board 4 -->
  <g transform="translate(840 610)">
    <rect x="0" y="0" width="700" height="420" rx="24" fill="#ffffff" stroke="#e2e8f0" filter="url(#cardShadow)"/>
    <text x="28" y="40" class="board">画板 4：剧集列表 → DramaDetail</text>
    <text x="28" y="64" class="sub">外层是剧集卡片；点进某一集后进入当前单集详情 UI。</text>

    <g transform="translate(28 98)">
      <rect x="0" y="0" width="204" height="232" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
      <rect x="20" y="20" width="164" height="86" rx="16" fill="url(#coverA)"/>
      <text x="20" y="134" class="h2">第 1 集：真假姐姐</text>
      <text x="20" y="158" class="body">姐姐被迫替妹妹嫁入豪门，</text>
      <text x="20" y="176" class="body">发现第一条线索。</text>
      <rect x="20" y="198" width="58" height="24" rx="9" fill="#dcfce7" stroke="#bbf7d0"/><text x="32" y="214" class="chip" fill="#15803d">可导出</text>
      <rect x="90" y="198" width="76" height="24" rx="9" fill="#ecfeff" stroke="#a5f3fc"/><text x="104" y="214" class="chip" fill="#0891b2">10 镜头</text>
    </g>

    <g transform="translate(248 98)">
      <rect x="0" y="0" width="204" height="232" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
      <rect x="20" y="20" width="164" height="86" rx="16" fill="#fef3c7"/>
      <text x="20" y="134" class="h2">第 2 集：暗门来信</text>
      <text x="20" y="158" class="body">密信出现，姐妹关系</text>
      <text x="20" y="176" class="body">开始反转。</text>
      <rect x="20" y="198" width="68" height="24" rx="9" fill="#fef3c7" stroke="#fde68a"/><text x="32" y="214" class="chip" fill="#a16207">待审片</text>
      <rect x="100" y="198" width="76" height="24" rx="9" fill="#ecfeff" stroke="#a5f3fc"/><text x="114" y="214" class="chip" fill="#0891b2">12 镜头</text>
    </g>

    <path d="M462 214 C502 214, 508 214, 542 214" fill="none" stroke="#0d9488" stroke-width="3" marker-end="url(#arrow)"/>

    <g transform="translate(546 98)">
      <rect x="0" y="0" width="126" height="232" rx="18" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="20" y="38" class="h2">DramaDetail</text>
      <text x="20" y="68" class="body">单集详情</text>
      <text x="20" y="94" class="body">沿用现有 UI</text>
      <text x="20" y="120" class="body">从剧集卡片进入</text>
      <rect x="20" y="150" width="86" height="36" rx="12" fill="url(#primary)"/><text x="38" y="173" class="btn">进入详情</text>
      <text x="20" y="210" class="mini">分镜 / 角色 / 场景</text>
      <text x="20" y="226" class="mini">配音 / 成片 / 审片</text>
    </g>

    <rect x="28" y="352" width="644" height="38" rx="14" fill="#f0fdfa" stroke="#ccfbf1"/>
    <text x="46" y="376" class="body">页面只展示小白需要操作的内容：项目、剧本、全局风格、剧集入口和单集详情。</text>
  </g>
</svg>
